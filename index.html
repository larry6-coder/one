<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ---------- Firebase setup ----------
// Get these values from: Firebase Console → Project settings → General →
// "Your apps" → the web app's SDK setup snippet. This config is meant to be
// public (it's not a secret) — real protection comes from Firestore Security Rules.
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID",
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const KV_COLLECTION = "maoni_kv";

// ---------- storage helpers (backed by Firestore — shared across every device/browser) ----------
const encode = (s) => {
  try { return btoa(unescape(encodeURIComponent(s))); } catch { return btoa(s); }
};

const genId = () => `sug_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

async function listAll(prefix) {
  try {
    const end = prefix + "\uf8ff";
    const snap = await db
      .collection(KV_COLLECTION)
      .where(firebase.firestore.FieldPath.documentId(), ">=", prefix)
      .where(firebase.firestore.FieldPath.documentId(), "<", end)
      .get();
    return snap.docs.map((d) => d.id);
  } catch (e) {
    console.error("listAll failed:", e);
    return [];
  }
}

async function getJSON(key) {
  try {
    const doc = await db.collection(KV_COLLECTION).doc(key).get();
    if (!doc.exists) return null;
    const data = doc.data();
    return data && data.value ? JSON.parse(data.value) : null;
  } catch (e) {
    console.error("getJSON failed:", e);
    return null;
  }
}

async function setJSON(key, value) {
  try {
    await db.collection(KV_COLLECTION).doc(key).set({ value: JSON.stringify(value) });
    return true;
  } catch (e) {
    console.error("setJSON failed:", e);
    return false;
  }
}

async function deleteJSON(key) {
  try {
    await db.collection(KV_COLLECTION).doc(key).delete();
    return true;
  } catch (e) {
    console.error("deleteJSON failed:", e);
    return false;
  }
}

function mailtoLink(email, subject, body) {
  return `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

const ADMIN_USERNAME = "admin";
const ADMIN_DEFAULT_PASSWORD = "Maoni@2024";
const EMAIL_SETTINGS_KEY = "settings:email";

// Sends via EmailJS (https://www.emailjs.com) — a browser-safe email API
// that doesn't need a hidden server secret. Silently no-ops if not configured.
async function sendEmailNotification(settings, { to_email, to_name, subject, heading, message_body }) {
  if (!settings || !settings.serviceId || !settings.templateId || !settings.publicKey || !to_email) {
    return { ok: false, reason: "not configured" };
  }
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: settings.serviceId,
        template_id: settings.templateId,
        user_id: settings.publicKey,
        template_params: { to_email, to_name, subject, heading, message_body },
      }),
    });
    return { ok: res.ok };
  } catch (e) {
    return { ok: false, reason: e.message };
  }
}

function MaoniApp() {
  const [booting, setBooting] = useState(true);
  const [screen, setScreen] = useState("auth"); // auth | client | admin
  const [authMode, setAuthMode] = useState("login"); // login | signup
  const [currentUser, setCurrentUser] = useState(null);

  const [formUsername, setFormUsername] = useState("");
  const [formPassword, setFormPassword] = useState("");
  const [formCompany, setFormCompany] = useState("");
  const [formEmail, setFormEmail] = useState("");
  const [authError, setAuthError] = useState("");
  const [authBusy, setAuthBusy] = useState(false);

  const [emailSettings, setEmailSettings] = useState(null);
  const [showSettings, setShowSettings] = useState(false);
  const [settingsForm, setSettingsForm] = useState({
    notifyEmail: "",
    serviceId: "",
    templateId: "",
    publicKey: "",
  });
  const [settingsSaved, setSettingsSaved] = useState(false);
  const [adminFlash, setAdminFlash] = useState("");

  const [codeRowOpenId, setCodeRowOpenId] = useState(null);
  const [codeInputValue, setCodeInputValue] = useState("");
  const [codeSending, setCodeSending] = useState(false);
  const [copiedId, setCopiedId] = useState(null);

  const [submissions, setSubmissions] = useState([]);
  const [subsLoading, setSubsLoading] = useState(false);

  const [newTitle, setNewTitle] = useState("");
  const [newMessage, setNewMessage] = useState("");
  const [sendBusy, setSendBusy] = useState(false);
  const [flash, setFlash] = useState("");

  const [adminFilter, setAdminFilter] = useState("all"); // all | pending | completed
  const [adminView, setAdminView] = useState("suggestions"); // suggestions | clients
  const [searchQuery, setSearchQuery] = useState("");

  const [clients, setClients] = useState([]);
  const [clientsLoading, setClientsLoading] = useState(false);

  const [accountForm, setAccountForm] = useState({ currentPassword: "", newUsername: "", newPassword: "" });
  const [accountError, setAccountError] = useState("");
  const [accountSaved, setAccountSaved] = useState(false);
  const [accountBusy, setAccountBusy] = useState(false);

  // Seed the admin account once — but only if no admin-role account exists yet at all,
  // so renaming the admin login later doesn't cause this to recreate a default one.
  useEffect(() => {
    (async () => {
      const keys = await listAll("users:");
      const items = (await Promise.all(keys.map((k) => getJSON(k)))).filter(Boolean);
      const hasAdmin = items.some((u) => u.role === "admin");
      if (!hasAdmin) {
        await setJSON(`users:${ADMIN_USERNAME}`, {
          username: ADMIN_USERNAME,
          password: encode(ADMIN_DEFAULT_PASSWORD),
          role: "admin",
          company: "Maoni Admin",
          createdAt: Date.now(),
        });
      }
      setBooting(false);
    })();
  }, []);

  const loadSubmissions = useCallback(async (user) => {
    setSubsLoading(true);
    const keys = await listAll("submissions:");
    const items = (await Promise.all(keys.map((k) => getJSON(k)))).filter(Boolean);
    items.sort((a, b) => b.createdAt - a.createdAt);
    const scoped =
      user && user.role === "admin"
        ? items
        : items.filter((s) => s.username === user.username);
    setSubmissions(scoped);
    setSubsLoading(false);
  }, []);

  useEffect(() => {
    if (currentUser) loadSubmissions(currentUser);
  }, [currentUser, loadSubmissions]);

  const loadClients = useCallback(async () => {
    setClientsLoading(true);
    const keys = await listAll("users:");
    const items = (await Promise.all(keys.map((k) => getJSON(k)))).filter(Boolean);
    const clientsOnly = items.filter((u) => u.role !== "admin");
    clientsOnly.sort((a, b) => b.createdAt - a.createdAt);
    setClients(clientsOnly);
    setClientsLoading(false);
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "admin") loadClients();
  }, [currentUser, loadClients]);

  function resetAuthForm() {
    setFormUsername("");
    setFormPassword("");
    setFormCompany("");
    setFormEmail("");
    setAuthError("");
  }

  const loadEmailSettings = useCallback(async () => {
    const s = await getJSON(EMAIL_SETTINGS_KEY);
    setEmailSettings(s);
    if (s) setSettingsForm(s);
    return s;
  }, []);

  useEffect(() => {
    if (currentUser && currentUser.role === "admin") loadEmailSettings();
  }, [currentUser, loadEmailSettings]);

  async function handleSaveSettings(e) {
    e.preventDefault();
    const cleaned = {
      notifyEmail: settingsForm.notifyEmail.trim(),
      serviceId: settingsForm.serviceId.trim(),
      templateId: settingsForm.templateId.trim(),
      publicKey: settingsForm.publicKey.trim(),
    };
    const ok = await setJSON(EMAIL_SETTINGS_KEY, cleaned);
    if (ok) {
      setEmailSettings(cleaned);
      setSettingsSaved(true);
      setTimeout(() => setSettingsSaved(false), 2500);
    }
  }

  async function handleChangeAdminAccount(e) {
    e.preventDefault();
    setAccountError("");

    const liveUser = await getJSON(`users:${currentUser.username}`);
    if (!liveUser || liveUser.password !== encode(accountForm.currentPassword)) {
      setAccountError("Current password is incorrect.");
      return;
    }

    const newUsername = accountForm.newUsername.trim().toLowerCase() || currentUser.username;
    const newPassword = accountForm.newPassword.trim();
    if (newPassword && newPassword.length < 4) {
      setAccountError("New password needs at least 4 characters.");
      return;
    }

    setAccountBusy(true);
    try {
      const updatedUser = {
        ...liveUser,
        username: newUsername,
        password: newPassword ? encode(newPassword) : liveUser.password,
      };

      if (newUsername !== currentUser.username) {
        const clash = await getJSON(`users:${newUsername}`);
        if (clash) {
          setAccountError("That username is already taken.");
          setAccountBusy(false);
          return;
        }
        const created = await setJSON(`users:${newUsername}`, updatedUser);
        if (!created) {
          setAccountError("Couldn't save the new username. Try again.");
          setAccountBusy(false);
          return;
        }
        await deleteJSON(`users:${currentUser.username}`);
      } else {
        await setJSON(`users:${currentUser.username}`, updatedUser);
      }

      setCurrentUser(updatedUser);
      setAccountForm({ currentPassword: "", newUsername: "", newPassword: "" });
      setAccountSaved(true);
      setTimeout(() => setAccountSaved(false), 2500);
    } finally {
      setAccountBusy(false);
    }
  }

  async function handleAuthSubmit(e) {
    e.preventDefault();
    setAuthError("");
    const uname = formUsername.trim().toLowerCase();
    const pass = formPassword;

    if (!uname || !pass) {
      setAuthError("Enter a username and password.");
      return;
    }

    setAuthBusy(true);
    try {
      if (authMode === "signup") {
        if (uname === ADMIN_USERNAME) {
          setAuthError("That username is reserved.");
          return;
        }
        if (pass.length < 4) {
          setAuthError("Password needs at least 4 characters.");
          return;
        }
        const existing = await getJSON(`users:${uname}`);
        if (existing) {
          setAuthError("That username is already taken.");
          return;
        }
        const user = {
          username: uname,
          password: encode(pass),
          role: "client",
          company: formCompany.trim() || uname,
          email: formEmail.trim(),
          createdAt: Date.now(),
        };
        const ok = await setJSON(`users:${uname}`, user);
        if (!ok) {
          setAuthError("Couldn't create your account. Try again.");
          return;
        }
        setCurrentUser(user);
        setScreen("client");
        resetAuthForm();
      } else {
        const user = await getJSON(`users:${uname}`);
        if (!user || user.password !== encode(pass)) {
          setAuthError("Username or password is incorrect.");
          return;
        }
        setCurrentUser(user);
        setScreen(user.role === "admin" ? "admin" : "client");
        resetAuthForm();
      }
    } finally {
      setAuthBusy(false);
    }
  }

  function handleLogout() {
    setCurrentUser(null);
    setSubmissions([]);
    setScreen("auth");
    setAuthMode("login");
    resetAuthForm();
  }

  async function handleSendSuggestion(e) {
    e.preventDefault();
    if (!newTitle.trim() || !newMessage.trim()) return;
    setSendBusy(true);
    const item = {
      id: genId(),
      username: currentUser.username,
      company: currentUser.company,
      email: currentUser.email || "",
      title: newTitle.trim(),
      message: newMessage.trim(),
      status: "pending",
      createdAt: Date.now(),
      updatedAt: Date.now(),
    };
    const ok = await setJSON(`submissions:${item.id}`, item);
    if (ok) {
      setNewTitle("");
      setNewMessage("");
      const settings = await getJSON(EMAIL_SETTINGS_KEY);
      let notified = false;
      if (settings && settings.notifyEmail) {
        const res = await sendEmailNotification(settings, {
          to_email: settings.notifyEmail,
          to_name: "Admin",
          subject: `New suggestion from ${currentUser.company}`,
          heading: `${currentUser.company} sent a new suggestion: "${item.title}"`,
          message_body: item.message,
        });
        notified = res.ok;
      }
      setFlash(notified ? "Suggestion sent — admin notified by email." : "Suggestion sent.");
      setTimeout(() => setFlash(""), 3000);
      loadSubmissions(currentUser);
    }
    setSendBusy(false);
  }

  async function toggleStatus(item) {
    const updated = {
      ...item,
      status: item.status === "pending" ? "completed" : "pending",
      updatedAt: Date.now(),
    };
    const ok = await setJSON(`submissions:${item.id}`, updated);
    if (ok) {
      let notified = false;
      if (updated.status === "completed") {
        const settings = emailSettings || (await getJSON(EMAIL_SETTINGS_KEY));
        const client = await getJSON(`users:${item.username}`);
        if (settings && client && client.email) {
          const res = await sendEmailNotification(settings, {
            to_email: client.email,
            to_name: client.company || client.username,
            subject: `Your suggestion is complete: "${item.title}"`,
            heading: `Good news — we've completed your suggestion "${item.title}".`,
            message_body: item.message,
          });
          notified = res.ok;
        }
      }
      setAdminFlash(
        updated.status === "completed"
          ? notified
            ? "Marked complete — client notified by email."
            : "Marked complete."
          : "Marked pending."
      );
      setTimeout(() => setAdminFlash(""), 3000);
      loadSubmissions(currentUser);
    }
  }

  function openCodeRow(item) {
    setCodeRowOpenId(item.id);
    setCodeInputValue(item.deliveryCode || "");
  }

  async function handleSendCode(item) {
    const code = codeInputValue.trim();
    if (!code) return;
    setCodeSending(true);
    const updated = {
      ...item,
      status: "completed",
      deliveryCode: code,
      deliveryCodeSentAt: Date.now(),
      updatedAt: Date.now(),
    };
    const ok = await setJSON(`submissions:${item.id}`, updated);
    if (ok) {
      let notified = false;
      const settings = emailSettings || (await getJSON(EMAIL_SETTINGS_KEY));
      const client = await getJSON(`users:${item.username}`);
      if (settings && client && client.email) {
        const res = await sendEmailNotification(settings, {
          to_email: client.email,
          to_name: client.company || client.username,
          subject: `Your code is ready — "${item.title}"`,
          heading: `Your suggestion "${item.title}" is complete. Here's your code:`,
          message_body: code,
        });
        notified = res.ok;
      }
      setAdminFlash(notified ? "Code sent — client notified by email." : "Code saved for the client.");
      setTimeout(() => setAdminFlash(""), 3000);
      setCodeRowOpenId(null);
      setCodeInputValue("");
      loadSubmissions(currentUser);
    }
    setCodeSending(false);
  }

  function copyCode(id, code) {
    if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
    setCopiedId(id);
    setTimeout(() => setCopiedId(null), 1500);
  }

  async function handleDeleteSuggestion(item) {
    const sure = window.confirm(`Delete the suggestion "${item.title}"? This can't be undone.`);
    if (!sure) return;
    const ok = await deleteJSON(`submissions:${item.id}`);
    if (ok) {
      setAdminFlash("Suggestion deleted.");
      setTimeout(() => setAdminFlash(""), 2500);
      loadSubmissions(currentUser);
    }
  }

  const pendingCount = submissions.filter((s) => s.status === "pending").length;
  const completedCount = submissions.filter((s) => s.status === "completed").length;
  const statusFiltered =
    adminFilter === "all" ? submissions : submissions.filter((s) => s.status === adminFilter);
  const visibleAdminItems = !searchQuery.trim()
    ? statusFiltered
    : statusFiltered.filter((s) => {
        const q = searchQuery.trim().toLowerCase();
        return (
          s.title.toLowerCase().includes(q) ||
          s.message.toLowerCase().includes(q) ||
          s.username.toLowerCase().includes(q) ||
          (s.company || "").toLowerCase().includes(q)
        );
      });

  function formatDate(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
  }

  return (
    <div className="maoni-root">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');

        .maoni-root {
          --bg: #0A0D13;
          --panel: #12161F;
          --elevated: #171C27;
          --border: #262C3A;
          --text: #EDEFF3;
          --text-dim: #8A93A6;
          --accent: #E8A33D;
          --accent-strong: #F2B65B;
          --success: #3FAE6B;
          --success-bg: rgba(63,174,107,0.12);
          --pending-bg: rgba(232,163,61,0.12);
          --danger: #E0616B;
          font-family: 'Inter', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          width: 100%;
          box-sizing: border-box;
        }
        .maoni-root *, .maoni-root *::before, .maoni-root *::after { box-sizing: border-box; }
        .maoni-root h1, .maoni-root h2, .maoni-root h3 {
          font-family: 'Sora', sans-serif;
          margin: 0;
          letter-spacing: -0.01em;
        }
        .maoni-root button { font-family: 'Inter', sans-serif; cursor: pointer; }
        .maoni-root input, .maoni-root textarea {
          font-family: 'Inter', sans-serif;
        }
        .maoni-root a { color: var(--accent); }

        /* ---------- auth screen ---------- */
        .auth-wrap {
          min-height: 100vh;
          display: grid;
          grid-template-columns: 1.1fr 1fr;
        }
        @media (max-width: 860px) {
          .auth-wrap { grid-template-columns: 1fr; }
        }

              <div className="stat-card">
                <div className="stat-num">{clients.length}</div>
                <div className="stat-label">Clients</div>
              </div>
              <div className="stat-card">
                <div className="stat-num">{submissions.length}</div>
                <div className="stat-label">Total suggestions</div>
              </div>
              <div className="stat-card">
                <div className="stat-num" style={{ color: "var(--accent-strong)" }}>{pendingCount}</div>
                <div className="stat-label">Pending</div>
              </div>
              <div className="stat-card">
                <div className="stat-num" style={{ color: "var(--success)" }}>{completedCount}</div>
                <div className="stat-label">Completed</div>
              </div>
            </div>

            <div className="admin-tabs">
              <button className={`admin-tab ${adminView === "suggestions" ? "active" : ""}`} onClick={() => setAdminView("suggestions")}>
                Suggestions
              </button>
              <button className={`admin-tab ${adminView === "clients" ? "active" : ""}`} onClick={() => setAdminView("clients")}>
                Clients
              </button>
            </div>

            {adminFlash && <div className="flash-msg" style={{ marginBottom: 16 }}>{adminFlash}</div>}

            {adminView === "suggestions" ? (
              <React.Fragment>
                <div className="list-heading">
                  <h2>All client suggestions</h2>
                  <span className="count-tag">{pendingCount} pending · {submissions.length} total</span>
                </div>

                <div className="search-row">
                  <Search size={15} />
                  <input
                    className="search-input"
                    placeholder="Search by client, title, or message"
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                  />
                </div>

                <div className="filter-row">
                  <button className={`filter-chip ${adminFilter === "all" ? "active" : ""}`} onClick={() => setAdminFilter("all")}>All</button>
                  <button className={`filter-chip ${adminFilter === "pending" ? "active" : ""}`} onClick={() => setAdminFilter("pending")}>Pending</button>
                  <button className={`filter-chip ${adminFilter === "completed" ? "active" : ""}`} onClick={() => setAdminFilter("completed")}>Completed</button>
                </div>

                {subsLoading ? (
                  <div className="footnote">Loading…</div>
                ) : visibleAdminItems.length === 0 ? (
                  <div className="empty-state">
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <Inbox size={16} />
                      <span style={{ color: "var(--text)" }}>Nothing here yet</span>
                    </div>
                    No suggestions match this filter right now.
                  </div>
                ) : (
                  visibleAdminItems.map((s) => (
                    <div className="sug-row" key={s.id}>
                      <div className="sug-row-top">
                        <div>
                          <div className="sug-title">{s.title}</div>
                          <div className="sug-message">{s.message}</div>
                        </div>
                        <div style={{ display: "flex", gap: 8, flexShrink: 0 }}>
                          <button
                            className={`status-btn ${s.status === "completed" ? "is-completed" : "is-pending"}`}
                            onClick={() => toggleStatus(s)}
                          >
                            {s.status === "completed" ? <CheckCircle2 size={14} /> : <Clock3 size={14} />}
                            {s.status === "completed" ? "Completed" : "Mark complete"}
                          </button>
                          <button className="icon-btn" title="Delete suggestion" onClick={() => handleDeleteSuggestion(s)}>
                            <Trash2 size={14} />
                          </button>
                        </div>
                      </div>
                      <div className="sug-meta">
                        <span className="sug-client">{s.company || s.username}</span>
                        <span>· @{s.username}</span>
                        <span>· Sent {formatDate(s.createdAt)}</span>
                      </div>

                      {s.email && (
                        <div className="email-row">
                          <Mail size={13} />
                          <span className="email-value">{s.email}</span>
                          <button className="text-link-btn" type="button" onClick={() => copyCode(`${s.id}-email`, s.email)}>
                            {copiedId === `${s.id}-email` ? "Copied!" : "Copy"}
                          </button>
                          <a
                            className="text-link-btn"
                            href={mailtoLink(
                              s.email,
                              `Your code is ready — "${s.title}"`,
                              s.deliveryCode
                                ? `Hi ${s.company || s.username},\n\nYour suggestion "${s.title}" is complete. Here's your code:\n\n${s.deliveryCode}\n\nThanks!`
                                : `Hi ${s.company || s.username},\n\nRegarding your suggestion "${s.title}":\n\n`
                            )}
                          >
                            Email client
                          </a>
                        </div>
                      )}

                      {s.deliveryCode && codeRowOpenId !== s.id && (
                        <div className="code-box">
                          <div className="code-box-label"><Send size={12} /> Code sent to client</div>
                          <code className="code-value">{s.deliveryCode}</code>
                          <button className="text-link-btn" type="button" onClick={() => openCodeRow(s)}>
                            Update
                          </button>
                        </div>
                      )}

                      {codeRowOpenId === s.id ? (
                        <form
                          className="code-form"
                          onSubmit={(e) => {
                            e.preventDefault();
                            handleSendCode(s);
                          }}
                        >
                          <input
                            className="field-input"
                            style={{ paddingLeft: 13 }}
                            placeholder="Paste or type the code to send"
                            value={codeInputValue}
                            onChange={(e) => setCodeInputValue(e.target.value)}
                            autoFocus
                          />
                          <div className="code-form-actions">
                            <button
                              className="btn-primary"
                              type="submit"
                              disabled={codeSending}
                              style={{ marginTop: 0, width: "auto", padding: "10px 18px" }}
                            >
                              {codeSending ? "Sending…" : "Send code to client"}
                            </button>
                            <button
                              type="button"
                              className="logout-btn"
                              onClick={() => {
                                setCodeRowOpenId(null);
                                setCodeInputValue("");
                              }}
                            >
                              Cancel
                            </button>
                          </div>
                        </form>
                      ) : (
                        !s.deliveryCode && (
                          <button className="text-link-btn code-trigger" type="button" onClick={() => openCodeRow(s)}>
                            <Send size={12} /> Send code to client
                          </button>
                        )
                      )}
                    </div>
                  ))
                )}
              </React.Fragment>
            ) : (
              <React.Fragment>
                <div className="list-heading">
                  <h2>Registered clients</h2>
                  <span className="count-tag">{clients.length} total</span>
                </div>
                {clientsLoading ? (
                  <div className="footnote">Loading…</div>
                ) : clients.length === 0 ? (
                  <div className="empty-state">
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
                      <Users size={16} />
                      <span style={{ color: "var(--text)" }}>No clients yet</span>
                    </div>
                    Clients will show up here once they sign up.
                  </div>
                ) : (
                  clients.map((c) => (
                    <div className="sug-row" key={c.username}>
                      <div className="sug-row-top">
                        <div>
                          <div className="sug-title">{c.company || c.username}</div>
                          <div className="sug-message">@{c.username} · Joined {formatDate(c.createdAt)}</div>
                        </div>
                      </div>
                      {c.email ? (
                        <div className="email-row" style={{ marginTop: 12 }}>
                          <Mail size={13} />
                          <span className="email-value">{c.email}</span>
                          <button className="text-link-btn" type="button" onClick={() => copyCode(`client-${c.username}`, c.email)}>
                            {copiedId === `client-${c.username}` ? "Copied!" : "Copy"}
                          </button>
                          <a className="text-link-btn" href={mailtoLink(c.email, `Hello from ${c.company || "us"}`, "")}>
                            Email client
                          </a>
                        </div>
                      ) : (
                        <div className="sug-meta" style={{ marginTop: 12 }}>No email on file</div>
                      )}
                    </div>
                  ))
                )}
              </React.Fragment>
            )}
          </div>

          {showSettings && (
            <div className="modal-overlay" onClick={() => setShowSettings(false)}>
              <div className="modal-box" onClick={(e) => e.stopPropagation()}>
                <div className="modal-head">
                  <h2 style={{ fontSize: 18, fontWeight: 600 }}>Email notifications</h2>
                  <button className="icon-btn" onClick={() => setShowSettings(false)}>
                    <X size={16} />
                  </button>
                </div>
                <p className="panel-sub" style={{ marginBottom: 18 }}>
                  Powered by EmailJS, a service that can send email straight from the browser —
                  no server needed. Create a free account at emailjs.com, connect your inbox, and
                  make one email template with the variables <code>to_email</code>,{" "}
                  <code>to_name</code>, <code>subject</code>, <code>heading</code> and{" "}
                  <code>message_body</code>. Then paste the three IDs it gives you below.
                </p>
                <form onSubmit={handleSaveSettings}>
                  <div className="field-group">
                    <label className="field-label">Your email (receives new-suggestion alerts)</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      type="email"
                      placeholder="you@example.com"
                      value={settingsForm.notifyEmail}
                      onChange={(e) => setSettingsForm({ ...settingsForm, notifyEmail: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Service ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="service_xxxxxxx"
                      value={settingsForm.serviceId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, serviceId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Template ID</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="template_xxxxxxx"
                      value={settingsForm.templateId}
                      onChange={(e) => setSettingsForm({ ...settingsForm, templateId: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">EmailJS Public Key</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder="public key from Account > API Keys"
                      value={settingsForm.publicKey}
                      onChange={(e) => setSettingsForm({ ...settingsForm, publicKey: e.target.value })}
                    />
                  </div>
                  <button className="btn-primary" type="submit">
                    Save settings
                  </button>
                  {settingsSaved && (
                    <div className="flash-msg" style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6 }}>
                      <CheckCircle size={14} /> Settings saved.
                    </div>
                  )}
                </form>

                <div className="modal-divider" />

                <h2 style={{ fontSize: 18, fontWeight: 600, marginBottom: 6 }}>Change admin login</h2>
                <p className="panel-sub" style={{ marginBottom: 18 }}>
                  Update your own username and/or password. You'll need your current password to confirm.
                </p>
                {accountError && (
                  <div className="auth-err">
                    <AlertCircle size={15} style={{ marginTop: 1, flexShrink: 0 }} />
                    <span>{accountError}</span>
                  </div>
                )}
                <form onSubmit={handleChangeAdminAccount}>
                  <div className="field-group">
                    <label className="field-label">Current password</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      type="password"
                      placeholder="Required to confirm changes"
                      value={accountForm.currentPassword}
                      onChange={(e) => setAccountForm({ ...accountForm, currentPassword: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">New username (optional)</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      placeholder={currentUser.username}
                      value={accountForm.newUsername}
                      onChange={(e) => setAccountForm({ ...accountForm, newUsername: e.target.value })}
                    />
                  </div>
                  <div className="field-group">
                    <label className="field-label">New password (optional)</label>
                    <input
                      className="field-input"
                      style={{ paddingLeft: 13 }}
                      type="password"
                      placeholder="Leave blank to keep current password"
                      value={accountForm.newPassword}
                      onChange={(e) => setAccountForm({ ...accountForm, newPassword: e.target.value })}
                    />
                  </div>
                  <button className="btn-primary" type="submit" disabled={accountBusy}>
                    {accountBusy ? "Saving…" : "Update login"}
                  </button>
                  {accountSaved && (
                    <div className="flash-msg" style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 6 }}>
                      <CheckCircle size={14} /> Login updated.
                    </div>
                  )}
                </form>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MaoniApp />);
</script>
</body>
</html>
